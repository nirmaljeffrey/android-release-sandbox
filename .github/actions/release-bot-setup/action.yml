name: Release bot setup
description: Python + release_bot deps, and optional keyless Google auth (Workload Identity Federation).
inputs:
  workload_identity_provider:
    description: projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
    required: false
    default: ""
  service_account:
    description: Service account linked in Play Console (and with BigQuery read on the Crashlytics export)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: release_bot/requirements.txt
    - shell: bash
      run: pip install -r release_bot/requirements.txt
    - if: inputs.workload_identity_provider != ''
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
