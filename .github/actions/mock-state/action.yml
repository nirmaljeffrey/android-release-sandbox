name: Mock Play state
description: >
  Sandbox only (RELEASE_BOT_MOCK=true). Carries the mock Play track and health
  data between workflow runs using the Actions cache. A no-op in production.
inputs:
  mode:
    description: restore | save
    required: true
runs:
  using: composite
  steps:
    - if: inputs.mode == 'restore'
      uses: actions/cache/restore@v4
      with:
        path: .mock-state
        key: mock-play-state-${{ github.run_id }}-${{ github.run_attempt }}
        # Newest matching cache wins, i.e. the state left by the previous run.
        restore-keys: mock-play-state-
    - if: inputs.mode == 'save' && hashFiles('.mock-state/state.json') != ''
      uses: actions/cache/save@v4
      with:
        path: .mock-state
        key: mock-play-state-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
