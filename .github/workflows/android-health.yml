# Health gate for every app; halts automatically when a halt rule fires.
# Every 3 hours, and immediately on a Grafana webhook (repository_dispatch "rollout-alert").
name: "Android · Health check"

on:
  schedule:
    - cron: "*/15 * * * *"   # SANDBOX: every 15 min (production: "17 */3 * * *")
  repository_dispatch:
    types: [rollout-alert]
  workflow_dispatch:
    inputs:
      app:
        description: "Only this app (empty = all apps)"
        required: false
        type: string
      dry_run:
        description: "Check and report only — change nothing on Play"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: vaazh-studios/headless-mobile-release-bot/.github/workflows/rw-health.yml@main
    with:
      app: ${{ inputs.app || '' }}
      dry_run: ${{ inputs.dry_run || false }}
    # Pass secrets by name: `secrets: inherit` only works inside one GitHub organization.
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      RELEASE_BOT_REPO_TOKEN: ${{ secrets.RELEASE_BOT_REPO_TOKEN }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      PAGERDUTY_API_TOKEN: ${{ secrets.PAGERDUTY_API_TOKEN }}
      PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
      OPTIMIZELY_TOKEN: ${{ secrets.OPTIMIZELY_TOKEN }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      RELEASE_BOT_HTTP_ENV: ${{ secrets.RELEASE_BOT_HTTP_ENV }}
      AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
      AMPLITUDE_SECRET_KEY: ${{ secrets.AMPLITUDE_SECRET_KEY }}
