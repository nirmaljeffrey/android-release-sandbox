# Health gate for every app; halts automatically when a halt rule fires.
# Every 3 hours, and immediately on a Grafana webhook (repository_dispatch "rollout-alert").
name: "Android · Health check"

on:
  schedule:
    - cron: "*/15 * * * *"   # SANDBOX: every 15 min (production: "17 */3 * * *")
  repository_dispatch:
    types: [rollout-alert]
  workflow_dispatch:
    inputs:
      app:
        description: "Only this app (empty = all apps)"
        required: false
        type: string
      dry_run:
        description: "Check and report only — change nothing on Play"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: vaazh-studios/headless-mobile-release-bot/.github/workflows/rw-health.yml@main
    with:
      app: ${{ inputs.app || '' }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
