# Checks every permission and connection each app needs, with fix-it hints. Read-only.
name: "Android · Doctor"

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Only this app (empty = all apps)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: vaazh-studios/headless-mobile-release-bot/.github/workflows/rw-doctor.yml@main
    with:
      app: ${{ inputs.app }}
    # Pass secrets by name: `secrets: inherit` only works inside one GitHub organization.
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      RELEASE_BOT_REPO_TOKEN: ${{ secrets.RELEASE_BOT_REPO_TOKEN }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      PAGERDUTY_API_TOKEN: ${{ secrets.PAGERDUTY_API_TOKEN }}
      PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
      OPTIMIZELY_TOKEN: ${{ secrets.OPTIMIZELY_TOKEN }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      RELEASE_BOT_HTTP_ENV: ${{ secrets.RELEASE_BOT_HTTP_ENV }}
      AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
      AMPLITUDE_SECRET_KEY: ${{ secrets.AMPLITUDE_SECRET_KEY }}
