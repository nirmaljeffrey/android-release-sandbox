name: "Release bot · Tests"

on:
  pull_request:
    paths:
      - "release_bot/**"
      - "tests/**"
      - "release-bot.yml"
      - ".github/workflows/android-*.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/release-bot-setup
      - run: pip install pytest && python -m pytest -q tests
