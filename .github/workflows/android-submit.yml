# Release day, after the smoke test: the on-duty @android-release-hero runs this
# from the Actions tab ("Run workflow", branch: main).
name: "Release · Submit to the store"
run-name: "Submit ${{ inputs.app && format('{0} ', inputs.app) || '' }}${{ inputs.tag }}"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "android or ios"
        type: choice
        options: [android, ios]
        default: android
      app:
        description: "App id from release-bot.yml (leave empty if only one app is configured)"
        required: false
        type: string
      tag:
        description: "Release tag created by CI, e.g. v4.12.0 (or shop/v4.12.0 with a tag_prefix)"
        required: true
        type: string
      whats_new:
        description: "Play 'What's new' (en-US, max 500 chars). Leave empty for the default text."
        required: false
        type: string
      supersede_unfinished_rollout:
        description: "Last release isn't at 100% yet. Replace it anyway?"
        type: boolean
        default: false

concurrency:
  group: android-release-${{ inputs.app || 'app' }}${{ inputs.platform == 'ios' && '-ios' || '' }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: vaazh-studios/headless-mobile-release-bot/.github/workflows/rw-submit.yml@quality/contracts-and-mocks
    with:
      bot_ref: quality/contracts-and-mocks   # TEMP: until PRs #2/#3 merge
      platform: ${{ inputs.platform }}
      app: ${{ inputs.app }}
      tag: ${{ inputs.tag }}
      whats_new: ${{ inputs.whats_new }}
      supersede_unfinished_rollout: ${{ inputs.supersede_unfinished_rollout }}
    # Pass secrets by name: `secrets: inherit` only works inside one GitHub organization.
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      RELEASE_BOT_REPO_TOKEN: ${{ secrets.RELEASE_BOT_REPO_TOKEN }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
