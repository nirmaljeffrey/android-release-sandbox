# Release day, after the smoke test: the on-duty @android-release-hero runs this
# from the Actions tab ("Run workflow", branch: main).
name: "Android · Submit to Play"
run-name: "Submit ${{ inputs.app && format('{0} ', inputs.app) || '' }}${{ inputs.tag }}"

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App id from release-bot.yml (leave empty if only one app is configured)"
        required: false
        type: string
      tag:
        description: "Release tag created by CI, e.g. v4.12.0 (or shop/v4.12.0 with a tag_prefix)"
        required: true
        type: string
      whats_new:
        description: "Play 'What's new' (en-US, max 500 chars). Leave empty for the default text."
        required: false
        type: string
      supersede_unfinished_rollout:
        description: "Last release isn't at 100% yet. Replace it anyway?"
        type: boolean
        default: false

concurrency:
  group: android-release-${{ inputs.app || 'app' }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: vaazh-studios/headless-mobile-release-bot/.github/workflows/rw-submit.yml@main
    with:
      app: ${{ inputs.app }}
      tag: ${{ inputs.tag }}
      whats_new: ${{ inputs.whats_new }}
      supersede_unfinished_rollout: ${{ inputs.supersede_unfinished_rollout }}
    # Pass secrets by name: `secrets: inherit` only works inside one GitHub organization.
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
      RELEASE_BOT_REPO_TOKEN: ${{ secrets.RELEASE_BOT_REPO_TOKEN }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
