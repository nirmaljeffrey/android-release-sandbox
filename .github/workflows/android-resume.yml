# Resume a halted rollout at the same percentage. Release hero only.
name: "Android · Resume rollout"

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App id (leave empty if only one app is configured)"
        required: false
        type: string
      reason:
        description: "Why is it safe to continue? (posted to Slack)"
        required: true
        type: string

concurrency:
  group: android-release-${{ inputs.app || 'app' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: vaazh-studios/headless-mobile-release-bot/.github/workflows/rw-resume.yml@main
    with:
      app: ${{ inputs.app }}
      reason: ${{ inputs.reason }}
    # Pass secrets by name: `secrets: inherit` only works inside one GitHub organization.
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
      RELEASE_BOT_REPO_TOKEN: ${{ secrets.RELEASE_BOT_REPO_TOKEN }}
