# Sandbox only: stands in for your real CI, which already creates release tags.
name: "Sandbox · Create release tag"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, e.g. 1.2.0"
        required: true
        type: string
      tag_prefix:
        description: "The app's tag_prefix from release-bot.yml, e.g. shop/ (empty for plain vX.Y.Z)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          VERSION: ${{ inputs.version }}
          PREFIX: ${{ inputs.tag_prefix }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::use X.Y.Z"; exit 1; }
          [[ -z "$PREFIX" || "$PREFIX" =~ ^[a-z0-9._-]+/$ ]] || { echo "::error::prefix looks like 'shop/'"; exit 1; }
          tag="${PREFIX}v$VERSION"
          git tag "$tag"
          git push origin "$tag"
          echo "Created $tag. Now run 'Android · Submit to Play' with tag $tag" >> "$GITHUB_STEP_SUMMARY"
