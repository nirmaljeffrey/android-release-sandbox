# Sandbox only (RELEASE_BOT_MOCK=true): make one app's mock health data go bad
# (or good again), then run its health check. Leave this out of production repos.
name: "Sandbox · Inject incident"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "android or ios"
        type: choice
        options: [android, ios]
        default: android
      app:
        description: "App id (leave empty if only one app is configured)"
        required: false
        type: string
      incident:
        description: "What should the mock health data show?"
        type: choice
        options: [new-crash, anr-regression, anr-over-threshold, grafana-critical, grafana-warning, datadog-alert, datadog-warn, none]

concurrency:
  group: android-release-${{ inputs.app || 'app' }}${{ inputs.platform == 'ios' && '-ios' || '' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    uses: vaazh-studios/headless-mobile-release-bot/.github/workflows/rw-inject.yml@quality/contracts-and-mocks
    with:
      bot_ref: quality/contracts-and-mocks   # TEMP: until PRs #2/#3 merge
      platform: ${{ inputs.platform }}
      app: ${{ inputs.app }}
      incident: ${{ inputs.incident }}
    # Pass secrets by name: `secrets: inherit` only works inside one GitHub organization.
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      RELEASE_BOT_REPO_TOKEN: ${{ secrets.RELEASE_BOT_REPO_TOKEN }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      PAGERDUTY_API_TOKEN: ${{ secrets.PAGERDUTY_API_TOKEN }}
      PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
      OPTIMIZELY_TOKEN: ${{ secrets.OPTIMIZELY_TOKEN }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      RELEASE_BOT_HTTP_ENV: ${{ secrets.RELEASE_BOT_HTTP_ENV }}
      AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
      AMPLITUDE_SECRET_KEY: ${{ secrets.AMPLITUDE_SECRET_KEY }}
