# Two Play developer accounts: three apps on one, one app on the other.
defaults:
  timezone: Europe/Berlin
  play:
    track: production
    initial_fraction: 0.02
    release_notes_language: en-US
    default_release_notes: "Bug fixes and performance improvements."
    changes_not_sent_for_review: false
  rollout:
    steps: [0.02, 0.20, 0.50, 1.0]
    targets: {monday: 0.20, tuesday: 0.50, wednesday: 1.0}
  health:
    min_distinct_users: 1000
    crashlytics: {enabled: true, project: p, dataset: firebase_crashlytics, table: t, lookback_days: 30, new_issue_min_users: 25}
    play_vitals:
      enabled: true
      halt: {user_perceived_crash_rate: 0.0109, user_perceived_anr_rate: 0.0047}
      hold: {crash_rate_increase_ratio: 1.25, anr_rate_increase_ratio: 1.25}
    grafana: {enabled: false, matchers: ['team="mobile"'], halt_severities: [critical], hold_severities: [warning]}
  slack: {channel_id: C_RELEASES, announce_channel_id: C_ANNOUNCE, alerts_channel_id: C_ALERTS, hero_usergroup_id: ""}
  access: {release_heroes: {}}

accounts:
  vaazh: {environment: play-vaazh}
  partner: {}                       # → environment play-partner

apps:
  shop:
    account: vaazh
    name: Shop
    package_name: com.vaazh.shop
    tag_prefix: "shop/"
    build: {project_dir: apps/shop}
    signing_environment: android-signing-shop
  chat:
    account: vaazh
    package_name: com.vaazh.chat
    tag_prefix: "chat/"
    build: {project_dir: apps/chat}
    health: {min_distinct_users: 200}          # smaller app
  fitness:
    account: vaazh
    package_name: com.vaazh.fitness
    tag_prefix: "fitness/"
    rollout: {targets: {tuesday: 0.20, wednesday: 0.50, thursday: 1.0}}
  partner-app:
    account: partner
    name: Partner
    package_name: com.partner.app
    repository: partner-org/partner-android    # lives in another repo
    slack: {channel_id: C_PARTNER}
