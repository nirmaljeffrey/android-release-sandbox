# Two teams, each with its own rollout schedule and health rules.
defaults:
  timezone: UTC
  play: {track: production, release_notes_language: en-US, default_release_notes: "Fixes.", changes_not_sent_for_review: false}
  rollout:
    platforms: aligned
    schedule:
      - {on: monday, percent: 1}
      - {on: tuesday, percent: 2}
      - {on: wednesday, percent: 100}
  health:
    min_users: 1000
    sources: {play_vitals: {}, crashlytics: {project: p, dataset: d, table: t}, grafana: {matchers: ['team="mobile"']}}
    rules:
      - {name: Google ANR line, source: play_vitals, metric: user_perceived_anr_rate, above: "0.47%", action: halt}
      - {name: Google crash line, source: play_vitals, metric: user_perceived_crash_rate, above: "1.09%", action: halt}
      - {name: ANR regression, source: play_vitals, metric: user_perceived_anr_rate, above_previous_by: "25%", action: hold}
      - {name: New crash, source: crashlytics, metric: new_fatal_issue_users, at_least: 25, action: halt}
      - {name: Pager, source: grafana, severity: critical, action: halt}
      - {name: Latency, source: grafana, severity: warning, alert: latency, action: notify}
  slack: {channel_id: C1, announce_channel_id: C2, alerts_channel_id: C3, hero_usergroup_id: ""}
  access: {release_heroes: {}}

accounts:
  main: {environment: play-main}

apps:
  checkout-team:                     # Android + iOS, same schedule (Apple-compatible)
    account: main
    package_name: com.example.checkout
    platforms: [android, ios]

  growth-team:                       # different schedule per platform, its own rules
    account: main
    package_name: com.example.growth
    platforms: [android, ios]
    rollout:
      platforms: separate
      when_data_is_thin: advance
      android:
        schedule:
          - {on: day 1, percent: 5}
          - {on: day 3, percent: 25}
          - {on: day 5, percent: 100}
      ios:
        schedule:
          - {on: day 4, percent: 1}
          - {on: day 6, percent: 5}
          - {on: day 7, percent: 100}
    health:
      min_users: 200
      rules:                         # replaces the defaults list for this team
        - {name: Strict ANR, source: play_vitals, metric: user_perceived_anr_rate, above: "0.30%", action: halt}
        - {name: Any new crash, source: crashlytics, at_least: 5, action: halt}

  bad-ios-team:                      # 20% on day one isn't possible with Apple's phased release
    account: main
    package_name: com.example.bad
    platforms: [android, ios]
    rollout:
      schedule:
        - {on: monday, percent: 20}
        - {on: wednesday, percent: 100}
