# Slack → api.slack.com/apps → Create New App → From a manifest → paste this.
display_information:
  name: Release Bot
  description: Posts Android release progress, holds and halts.
features:
  bot_user:
    display_name: Release Bot
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write          # post release threads, announcements, alerts
      - channels:history    # find this release's thread again (public channels)
      - channels:join       # join public channels by itself, no /invite needed
      - groups:history      # same, for private channels
      - usergroups:read     # who is in @android-release-hero (paid Slack plans only)
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
