title: Grafana critical alert, then manual resume
description: An API 5xx alert fires Saturday morning and the webhook halts the rollout within minutes. Monday the hero confirms it was an unrelated backend incident and resumes. The plan shifts by a day (one step per run).
previous_release: {name: "4.11.0", version_code: 41100, status: completed}
new_release: {tag: v4.12.0, version_code: 41200}
on_duty: [U0123456789]        # Slack ID of octocat in release-bot.yml
submit_actor: octocat
daily_users: 100000
baseline: {crash: 0.0040, anr: 0.0020}   # previous version (fractions: 0.004 = 0.40%)
vitals_lag_hours: 36
review_hours: 8
new_version:
  - {from: "thu 18:00", crash: 0.0041, anr: 0.0021}
grafana_alerts:
  - from: "sat 10:00"
    until: "sat 14:00"
    webhook: true
    labels: {alertname: "Android API 5xx > 2%", severity: critical, team: mobile}
    annotations: {summary: "5xx rate 3.4% on /v2/checkout for app_version 4.12.0"}
manual_actions:
  - {at: "mon 09:30", command: resume, actor: octocat, reason: "Backend incident INC-412, unrelated to 4.12.0, fixed"}
expect: {final_status: inProgress, final_fraction: 0.5}
