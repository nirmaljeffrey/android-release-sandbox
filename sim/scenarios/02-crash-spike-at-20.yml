title: New crash after going to 20%
description: A brand-new fatal crash in checkout shows up in Crashlytics on Monday afternoon. The next 3-hourly check halts the rollout at 20%.
previous_release: {name: "4.11.0", version_code: 41100, status: completed}
new_release: {tag: v4.12.0, version_code: 41200}
on_duty: [U0123456789]        # Slack ID of octocat in release-bot.yml
submit_actor: octocat
daily_users: 100000
baseline: {crash: 0.0040, anr: 0.0020}   # previous version (fractions: 0.004 = 0.40%)
vitals_lag_hours: 36
review_hours: 8
new_version:
  - {from: "thu 18:00", crash: 0.0041, anr: 0.0021}
crashlytics_new_issues:
  - {from: "mon 13:00", title: "NullPointerException in CheckoutViewModel.onPayClicked", users: 140}
expect: {final_status: halted, final_fraction: 0.2}
