title: Slow Google review
description: Google takes until Sunday to approve. Monday holds (no Vitals data yet for the new version), Tuesday and Wednesday each move one step.
previous_release: {name: "4.11.0", version_code: 41100, status: completed}
new_release: {tag: v4.12.0, version_code: 41200}
on_duty: [U0123456789]        # Slack ID of octocat in release-bot.yml
submit_actor: octocat
daily_users: 100000
baseline: {crash: 0.0040, anr: 0.0020}   # previous version (fractions: 0.004 = 0.40%)
vitals_lag_hours: 36
review_hours: 60
new_version:
  - {from: "thu 18:00", crash: 0.0041, anr: 0.0021}
expect: {final_status: inProgress, final_fraction: 0.5}
