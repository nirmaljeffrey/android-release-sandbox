# SANDBOX (mock mode): two Play developer accounts, four apps, one repo.
# All four "apps" build the same toy app at the repo root; tags use a prefix per app.

defaults:
  timezone: UTC
  play: {track: production, initial_fraction: 0.02, release_notes_language: en-US,
         default_release_notes: "Bug fixes and performance improvements.", changes_not_sent_for_review: false}
  rollout:
    steps: [0.02, 0.20, 0.50, 1.0]
    targets: {monday: 0.20, tuesday: 0.50, wednesday: 1.0}   # mock mode: every run = one step anyway
  health:
    min_distinct_users: 1000
    crashlytics: {enabled: true, project: mock, dataset: mock, table: mock, lookback_days: 30, new_issue_min_users: 25}
    play_vitals:
      enabled: true
      halt: {user_perceived_crash_rate: 0.0109, user_perceived_anr_rate: 0.0047}
      hold: {crash_rate_increase_ratio: 1.25, anr_rate_increase_ratio: 1.25}
    grafana: {enabled: true, matchers: ['team="mobile"'], halt_severities: [critical], hold_severities: [warning]}
  slack: {channel_id: "", announce_channel_id: "", alerts_channel_id: "", hero_usergroup_id: ""}   # from repo variables
  access: {release_heroes: {}}

accounts:
  vaazh:   {environment: play-vaazh}
  partner: {environment: play-partner}

apps:
  shop:        {account: vaazh,   name: Shop,    package_name: com.vaazh.shop,    tag_prefix: "shop/"}
  chat:        {account: vaazh,   name: Chat,    package_name: com.vaazh.chat,    tag_prefix: "chat/"}
  fitness:     {account: vaazh,   name: Fitness, package_name: com.vaazh.fitness, tag_prefix: "fitness/"}
  partner-app: {account: partner, name: Partner, package_name: com.partner.app,   tag_prefix: "partner/"}
