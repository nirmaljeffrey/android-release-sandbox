# SANDBOX (mock mode): two Play developer accounts, four apps (teams), one repo.
defaults:
  timezone: UTC
  play: {track: production, release_notes_language: en-US,
         default_release_notes: "Bug fixes and performance improvements.", changes_not_sent_for_review: false}
  rollout:
    platforms: aligned
    schedule:                       # mock mode: every Rollout step run moves one step
      - {on: monday,    percent: 1}
      - {on: tuesday,   percent: 2}
      - {on: wednesday, percent: 100}
  health:
    min_users: 500
    sources: {play_vitals: {}, crashlytics: {project: mock, dataset: mock, table: mock}, grafana: {matchers: ['team="mobile"']}}
    rules:
      - {name: Google ANR line, source: play_vitals, metric: user_perceived_anr_rate, above: "0.47%", action: halt}
      - {name: ANR regression,  source: play_vitals, metric: user_perceived_anr_rate, above_previous_by: "25%", action: hold}
      - {name: New crash,       source: crashlytics, metric: new_fatal_issue_users, at_least: 25, action: halt}
      - {name: Pager alert,     source: grafana, severity: critical, action: halt}
      - {name: Warning alert,   source: grafana, severity: warning, action: hold}
  slack: {channel_id: "", announce_channel_id: "", alerts_channel_id: "", hero_usergroup_id: ""}
  access: {release_heroes: {}}

accounts:
  vaazh:   {environment: play-vaazh}
  partner: {environment: play-partner}

apps:
  shop:    {account: vaazh, name: Shop, package_name: com.vaazh.shop, tag_prefix: "shop/", platforms: [android, ios]}
  chat:
    account: vaazh
    name: Chat
    package_name: com.vaazh.chat
    tag_prefix: "chat/"
    health:                         # this team: Grafana warnings only notify
      rules:
        - {name: New crash,     source: crashlytics, metric: new_fatal_issue_users, at_least: 25, action: halt}
        - {name: Pager alert,   source: grafana, severity: critical, action: halt}
        - {name: Latency FYI,   source: grafana, severity: warning, action: notify}
  fitness:
    account: vaazh
    name: Fitness
    package_name: com.vaazh.fitness
    tag_prefix: "fitness/"
    rollout:                        # this team: 5 steps over 5 days
      schedule:
        - {on: day 1, percent: 5}
        - {on: day 2, percent: 10}
        - {on: day 3, percent: 25}
        - {on: day 4, percent: 50}
        - {on: day 5, percent: 100}
  partner-app: {account: partner, name: Partner, package_name: com.partner.app, tag_prefix: "partner/"}
